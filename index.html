<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BLOCK WORLD X</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:28px;
    z-index:20;
    pointer-events:none;
    text-shadow:0 0 4px #000;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:30;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

#health{
    font-size:22px;
    margin-bottom:7px;
}

#info{
    font-size:14px;
    line-height:1.5;
}

#inventory{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:50;
    background:rgba(0,0,0,.45);
    padding:8px;
    border:2px solid rgba(255,255,255,.35);
}

.slot{
    width:58px;
    height:58px;
    border:3px solid #777;
    background:rgba(30,30,30,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
}

.slot.selected{
    border-color:white;
    transform:translateY(-5px);
}

.slot .num{
    position:absolute;
    left:4px;
    top:2px;
    color:white;
    font-size:12px;
}

.slot .count{
    position:absolute;
    right:4px;
    bottom:2px;
    color:white;
    font-size:13px;
}

.block-icon{
    width:30px;
    height:30px;
    border:1px solid #222;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#07111dcc,#000);
    color:white;
    text-align:center;
}

.panel{
    width:min(550px,90%);
    background:rgba(10,10,15,.92);
    border:2px solid #777;
    padding:35px;
    box-shadow:0 0 40px #000;
}

.panel h1{
    font-size:44px;
    margin-bottom:10px;
    letter-spacing:3px;
}

.panel p{
    color:#ccc;
    margin:10px 0;
    line-height:1.6;
}

button{
    border:0;
    background:#fff;
    color:#000;
    padding:14px 24px;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
    margin-top:15px;
}

#message{
    position:fixed;
    left:50%;
    top:20%;
    transform:translateX(-50%);
    z-index:80;
    color:white;
    font-weight:bold;
    font-size:20px;
    opacity:0;
    text-shadow:2px 2px 4px #000;
}
</style>
</head>

<body>

<div id="start">
    <div class="panel">
        <h1>BLOCK WORLD X</h1>
        <p>O'zing yaratgan voxel dunyoga xush kelibsiz.</p>
        <p>
            WASD — yurish<br>
            SPACE — sakrash<br>
            Sichqoncha — qarash<br>
            Chap tugma — blokni buzish<br>
            O'ng tugma — blok qo'yish<br>
            1-6 — blok tanlash<br>
            F — saqlash
        </p>
        <button id="play">O'YINNI BOSHLASH</button>
    </div>
</div>

<div id="crosshair">+</div>

<div id="hud">
    <div id="health">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
    <div id="info">
        BLOCK WORLD X<br>
        <span id="coords">X:0 Y:0 Z:0</span><br>
        <span id="selectedName">Grass</span>
    </div>
</div>

<div id="message"></div>

<div id="inventory"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BLOCK WORLD X
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x86c9ff);
scene.fog = new THREE.Fog(0x86c9ff,45,180);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.05,
    400
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHT
   ========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbde7ff,
    0x555555,
    1.4
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(40,80,20);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);

/* =========================================================
   TEXTURES / MATERIALS
   ========================================================= */

function mat(color){
    return new THREE.MeshLambertMaterial({
        color:color
    });
}

const materials = {

    grass:mat(0x55aa38),
    dirt:mat(0x80512c),
    stone:mat(0x7d7d7d),
    sand:mat(0xd9c27a),
    wood:mat(0x8b5a32),
    leaves:mat(0x2e8b39),
    glass:new THREE.MeshLambertMaterial({
        color:0x9eeeff,
        transparent:true,
        opacity:.45
    }),
    brick:mat(0x9c4937),
    obsidian:mat(0x29213d),
    water:new THREE.MeshLambertMaterial({
        color:0x2874c7,
        transparent:true,
        opacity:.72
    })
};

const BLOCKS = [
    {id:"grass",name:"Grass",material:materials.grass},
    {id:"dirt",name:"Dirt",material:materials.dirt},
    {id:"stone",name:"Stone",material:materials.stone},
    {id:"sand",name:"Sand",material:materials.sand},
    {id:"wood",name:"Wood",material:materials.wood},
    {id:"leaves",name:"Leaves",material:materials.leaves},
    {id:"brick",name:"Brick",material:materials.brick},
    {id:"obsidian",name:"Obsidian",material:materials.obsidian}
];

/* =========================================================
   WORLD DATA
   ========================================================= */

const world = new Map();
const meshes = new Map();

const WORLD_SIZE = 70;

function key(x,y,z){
    return `${x}|${y}|${z}`;
}

function setBlock(x,y,z,type){

    if(y < 0) return;

    const k = key(x,y,z);

    if(type === null){

        world.delete(k);

        const old = meshes.get(k);

        if(old){
            scene.remove(old);
            meshes.delete(k);
        }

        return;
    }

    world.set(k,type);

    const old = meshes.get(k);

    if(old){
        scene.remove(old);
    }

    const geo = new THREE.BoxGeometry(1,1,1);

    const mesh = new THREE.Mesh(
        geo,
        materials[type]
    );

    mesh.position.set(
        x+.5,
        y+.5,
        z+.5
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData = {
        x,y,z,type
    };

    scene.add(mesh);
    meshes.set(k,mesh);
}

function getBlock(x,y,z){
    return world.get(key(x,y,z));
}

/* =========================================================
   RANDOM / TERRAIN
   ========================================================= */

function seeded(x,z){

    let n =
        Math.sin(x*12.9898 + z*78.233) *
        43758.5453;

    return n-Math.floor(n);
}

function terrainHeight(x,z){

    const a =
        Math.sin(x*.09)*3 +
        Math.cos(z*.11)*3;

    const b =
        Math.sin((x+z)*.035)*7;

    const c =
        Math.cos((x-z)*.08)*2;

    return Math.floor(
        9+a+b+c
    );
}

function generateWorld(){

    const half = WORLD_SIZE/2;

    for(let x=-half;x<half;x++){

        for(let z=-half;z<half;z++){

            const h=terrainHeight(x,z);

            for(let y=0;y<=h;y++){

                let type="stone";

                if(y===h){
                    type = h<8 ? "sand":"grass";
                }
                else if(y>h-3){
                    type="dirt";
                }

                setBlock(x,y,z,type);
            }

            /* Trees */

            if(
                h>9 &&
                seeded(x,z)>.965 &&
                Math.abs(x)>4 &&
                Math.abs(z)>4
            ){

                for(let y=1;y<=4;y++){
                    setBlock(
                        x,
                        h+y,
                        z,
                        "wood"
                    );
                }

                for(
                    let dx=-2;
                    dx<=2;
                    dx++
                ){

                    for(
                        let dz=-2;
                        dz<=2;
                        dz++
                    ){

                        for(
                            let dy=3;
                            dy<=5;
                            dy++
                        ){

                            if(
                                Math.abs(dx)+
                                Math.abs(dz)+
                                Math.abs(dy-4)
                                <4
                            ){

                                if(
                                    !getBlock(
                                        x+dx,
                                        h+dy,
                                        z+dz
                                    )
                                ){

                                    setBlock(
                                        x+dx,
                                        h+dy,
                                        z+dz,
                                        "leaves"
                                    );
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

generateWorld();

/* =========================================================
   WATER
   ========================================================= */

for(let x=-35;x<35;x++){

    for(let z=-35;z<35;z++){

        let h=terrainHeight(x,z);

        if(h<6){

            setBlock(
                x,
                6,
                z,
                "water"
            );
        }
    }
}

/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    position:new THREE.Vector3(
        0,
        terrainHeight(0,0)+2,
        0
    ),

    velocity:new THREE.Vector3(),

    width:.65,
    height:1.8,

    speed:6,
    jump:8,

    health:10,

    grounded:false
};

camera.position.copy(
    player.position
);

let yaw=0;
let pitch=0;

let pointerLocked=false;

/* =========================================================
   INPUT
   ========================================================= */

const keys={};

addEventListener("keydown",e=>{

    keys[e.code]=true;

    if(
        e.code.startsWith("Digit")
    ){

        const n =
            parseInt(
                e.code.replace("Digit","")
            );

        if(n>=1 && n<=6){
            selectSlot(n-1);
        }
    }

    if(e.code==="KeyF"){
        saveGame();
    }
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/* =========================================================
   MOUSE LOOK
   ========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(!pointerLocked) return;

        yaw -= e.movementX*.0025;
        pitch -= e.movementY*.0025;

        pitch=Math.max(
            -Math.PI/2+.1,
            Math.min(
                Math.PI/2-.1,
                pitch
            )
        );
    }
);

/* =========================================================
   CLICK
   ========================================================= */

renderer.domElement.addEventListener(
    "click",
    ()=>{

        if(!pointerLocked){

            renderer.domElement.requestPointerLock();
            return;
        }

        breakBlock();
    }
);

document.addEventListener(
    "contextmenu",
    e=>{

        e.preventDefault();

        if(pointerLocked){
            placeBlock();
        }
    }
);

document.addEventListener(
    "pointerlockchange",
    ()=>{

        pointerLocked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);

/* =========================================================
   COLLISION
   ========================================================= */

function solidAt(x,y,z){

    const b=getBlock(
        Math.floor(x),
        Math.floor(y),
        Math.floor(z)
    );

    return b &&
        b!=="water" &&
        b!=="leaves";
}

function collision(){

    const p=player.position;

    const r=.3;

    const points=[
        [p.x-r,p.y,p.z-r],
        [p.x+r,p.y,p.z-r],
        [p.x-r,p.y,p.z+r],
        [p.x+r,p.y,p.z+r],

        [p.x-r,p.y+1,p.z-r],
        [p.x+r,p.y+1,p.z-r],
        [p.x-r,p.y+1,p.z+r],
        [p.x+r,p.y+1,p.z+r]
    ];

    for(const [x,y,z] of points){

        if(solidAt(x,y,z)){
            return true;
        }
    }

    return false;
}

function movePlayer(dx,dy,dz){

    player.position.x += dx;

    if(collision()){
        player.position.x -= dx;
        player.velocity.x=0;
    }

    player.position.z += dz;

    if(collision()){
        player.position.z -= dz;
        player.velocity.z=0;
    }

    player.position.y += dy;

    if(collision()){

        if(dy<0){

            player.grounded=true;
        }

        player.position.y -= dy;
        player.velocity.y=0;

    }else{
        player.grounded=false;
    }
}

/* =========================================================
   BLOCK RAYCAST
   ========================================================= */

const raycaster = new THREE.Raycaster();

function raycastBlock(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits =
        raycaster.intersectObjects(
            [...meshes.values()]
        );

    if(!hits.length) return null;

    const hit=hits[0];

    if(hit.distance>7) return null;

    return hit;
}

/* =========================================================
   BREAK
   ========================================================= */

function breakBlock(){

    const hit=raycastBlock();

    if(!hit) return;

    const d=hit.object.userData;

    if(d.y<=0) return;

    setBlock(
        d.x,
        d.y,
        d.z,
        null
    );
}

/* =========================================================
   INVENTORY
   ========================================================= */

const inventory = [

    {type:"grass",count:64},
    {type:"dirt",count:64},
    {type:"stone",count:64},
    {type:"sand",count:64},
    {type:"wood",count:32},
    {type:"leaves",count:32},
    {type:"brick",count:32},
    {type:"obsidian",count:16}
];

let selected=0;

function selectSlot(i){

    selected=i;

    updateInventory();

    document.getElementById(
        "selectedName"
    ).textContent =
        BLOCKS[
            selected
        ].name;
}

function updateInventory(){

    const el=
        document.getElementById(
            "inventory"
        );

    el.innerHTML="";

    for(
        let i=0;
        i<6;
        i++
    ){

        const slot=
            document.createElement("div");

        slot.className=
            "slot"+
            (i===selected
                ?" selected":"");

        const num=
            document.createElement("div");

        num.className="num";
        num.textContent=i+1;

        const icon=
            document.createElement("div");

        icon.className="block-icon";

        icon.style.background=
            BLOCKS[i].material.color.getStyle();

        const count=
            document.createElement("div");

        count.className="count";
        count.textContent=
            inventory[i].count;

        slot.appendChild(num);
        slot.appendChild(icon);
        slot.appendChild(count);

        slot.addEventListener(
            "click",
            ()=>{
                selectSlot(i);
            }
        );

        el.appendChild(slot);
    }
}

updateInventory();

/* =========================================================
   PLACE BLOCK
   ========================================================= */

function placeBlock(){

    const hit=raycastBlock();

    if(!hit) return;

    const d=hit.object.userData;

    const normal =
        hit.face.normal.clone();

    const x =
        d.x + Math.round(normal.x);

    const y =
        d.y + Math.round(normal.y);

    const z =
        d.z + Math.round(normal.z);

    if(getBlock(x,y,z)) return;

    /* player safety */

    const px=player.position.x;
    const py=player.position.y;
    const pz=player.position.z;

    if(
        x>=Math.floor(px-.4) &&
        x<=Math.floor(px+.4) &&
        z>=Math.floor(pz-.4) &&
        z<=Math.floor(pz+.4) &&
        y>=Math.floor(py) &&
        y<=Math.floor(py+1.8)
    ){
        return;
    }

    if(inventory[selected].count<=0) return;

    setBlock(
        x,y,z,
        BLOCKS[selected].id
    );

    inventory[selected].count--;

    updateInventory();
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function saveGame(){

    const save={
        player:{
            x:player.position.x,
            y:player.position.y,
            z:player.position.z,
            health:player.health
        },

        blocks:[
            ...world.entries()
        ],

        inventory
    };

    localStorage.setItem(
        "BLOCK_WORLD_X_SAVE",
        JSON.stringify(save)
    );

    showMessage(
        "✅ Dunyo saqlandi!"
    );
}

function loadGame(){

    const raw=
        localStorage.getItem(
            "BLOCK_WORLD_X_SAVE"
        );

    if(!raw) return;

    const save=
        JSON.parse(raw);

    for(const mesh of meshes.values()){
        scene.remove(mesh);
    }

    world.clear();
    meshes.clear();

    for(const [k,type] of save.blocks){

        const [x,y,z]=k
            .split("|")
            .map(Number);

        setBlock(
            x,y,z,type
        );
    }

    player.position.set(
        save.player.x,
        save.player.y,
        save.player.z
    );

    player.health=
        save.player.health;

    if(save.inventory){

        for(
            let i=0;
            i<inventory.length;
            i++
        ){

            inventory[i].count=
                save.inventory[i].count;
        }
    }

    updateInventory();

    showMessage(
        "✅ Dunyo yuklandi!"
    );
}

/* =========================================================
   MESSAGE
   ========================================================= */

let messageTimer=0;

function showMessage(text){

    const el=
        document.getElementById(
            "message"
        );

    el.textContent=text;
    el.style.opacity=1;

    clearTimeout(messageTimer);

    messageTimer=setTimeout(
        ()=>{
            el.style.opacity=0;
        },
        1800
    );
}

/* =========================================================
   DAY / NIGHT
   ========================================================= */

let worldTime=0;

function updateDayNight(dt){

    worldTime += dt*.02;

    const t=
        worldTime%(Math.PI*2);

    const sunX=
        Math.cos(t)*80;

    const sunY=
        Math.sin(t)*80;

    sun.position.set(
        sunX,
        Math.max(5,sunY),
        20
    );

    const brightness =
        Math.max(
            .2,
            Math.sin(t)*.5+.5
        );

    sun.intensity=
        .3+brightness*1.7;

    hemi.intensity=
        .45+brightness;

    const skyR=
        Math.floor(
            70+brightness*150
        );

    const skyG=
        Math.floor(
            80+brightness*150
        );

    const skyB=
        Math.floor(
            120+brightness*130
        );

    scene.background =
        new THREE.Color(
            `rgb(${skyR},${skyG},${skyB})`
        );

    scene.fog.color.copy(
        scene.background
    );
}

/* =========================================================
   ENEMIES
   ========================================================= */

const enemies=[];

function spawnEnemy(){

    const x=
        Math.floor(
            (Math.random()-.5)*50
        );

    const z=
        Math.floor(
            (Math.random()-.5)*50
        );

    const y=
        terrainHeight(x,z)+1;

    const geo=
        new THREE.BoxGeometry(
            .7,1.4,.7
        );

    const material=
        mat(0x8e2b2b);

    const mesh=
        new THREE.Mesh(
            geo,
            material
        );

    mesh.position.set(
        x+.5,
        y+.7,
        z+.5
    );

    mesh.castShadow=true;

    scene.add(mesh);

    enemies.push({
        mesh,
        health:3,
        speed:1.3
    });
}

for(let i=0;i<8;i++){
    spawnEnemy();
}

function updateEnemies(dt){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=enemies[i];

        const dx=
            player.position.x-
            e.mesh.position.x;

        const dz=
            player.position.z-
            e.mesh.position.z;

        const dist=
            Math.hypot(dx,dz);

        if(dist<18){

            if(dist>1.4){

                e.mesh.position.x +=
                    dx/dist*
                    e.speed*dt;

                e.mesh.position.z +=
                    dz/dist*
                    e.speed*dt;
            }

            if(dist<1.7){

                player.health-=
                    dt*.5;

                updateHealth();

                if(player.health<=0){

                    player.health=10;

                    player.position.set(
                        0,
                        terrainHeight(0,0)+2,
                        0
                    );

                    showMessage(
                        "💀 Siz qayta tirildingiz!"
                    );
                }
            }

        }
    }
}

/* =========================================================
   PLAYER HEALTH
   ========================================================= */

function updateHealth(){

    let s="";

    const hp=Math.ceil(
        player.health
    );

    for(
        let i=0;
        i<10;
        i++
    ){

        s +=
            i<hp
            ? "❤️"
            : "🖤";
    }

    document.getElementById(
        "health"
    ).textContent=s;
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function updatePlayer(dt){

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

    const move=
        new THREE.Vector3();

    if(keys["KeyW"])
        move.add(forward);

    if(keys["KeyS"])
        move.sub(forward);

    if(keys["KeyD"])
        move.add(right);

    if(keys["KeyA"])
        move.sub(right);

    if(move.length()>0){
        move.normalize();
    }

    player.velocity.x=
        move.x*player.speed;

    player.velocity.z=
        move.z*player.speed;

    if(
        keys["Space"] &&
        player.grounded
    ){

        player.velocity.y=
            player.jump;

        player.grounded=false;
    }

    player.velocity.y -=
        20*dt;

    movePlayer(
        player.velocity.x*dt,
        player.velocity.y*dt,
        player.velocity.z*dt
    );

    if(player.position.y<-20){

        player.position.set(
            0,
            terrainHeight(0,0)+3,
            0
        );
    }

    camera.position.set(
        player.position.x,
        player.position.y+1.55,
        player.position.z
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;

    document.getElementById(
        "coords"
    ).textContent=
        `X:${Math.floor(player.position.x)}
         Y:${Math.floor(player.position.y)}
         Z:${Math.floor(player.position.z)}`;
}

/* =========================================================
   START
   ========================================================= */

document.getElementById(
    "play"
).addEventListener(
    "click",
    ()=>{

        document.getElementById(
            "start"
        ).style.display="none";

        renderer.domElement.requestPointerLock();

        loadGame();
    }
);

/* =========================================================
   RESIZE
   ========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   GAME LOOP
   ========================================================= */

let last=performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=performance.now();

    let dt=
        (now-last)/1000;

    last=now;

    dt=Math.min(dt,.05);

    if(pointerLocked){

        updatePlayer(dt);
        updateEnemies(dt);
        updateDayNight(dt);
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   AUTO SAVE
   ========================================================= */

setInterval(
    ()=>{
        if(pointerLocked){
            saveGame();
        }
    },
    30000
);

</script>
</body>
</html>
